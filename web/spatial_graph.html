<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Carl — Galaksi Pengetahuan 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000008;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #galaxy-canvas {
      display: block;
      cursor: grab;
    }
    #galaxy-canvas:active { cursor: grabbing; }

    /* Top HUD */
    #hud-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(0,0,8,0.9) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    #hud-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #hud-title h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #hud-title span {
      font-size: 11px;
      color: #6b7280;
      display: block;
      margin-top: 1px;
      -webkit-text-fill-color: #6b7280;
    }
    #stats-badge {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: #a78bfa;
      pointer-events: none;
    }

    /* Tooltip */
    #tooltip {
      position: absolute;
      background: rgba(17, 17, 34, 0.95);
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      max-width: 220px;
      pointer-events: none;
      display: none;
      z-index: 20;
      box-shadow: 0 4px 20px rgba(139,92,246,0.3);
    }
    #tooltip .tt-title {
      font-weight: 700;
      color: #c4b5fd;
      margin-bottom: 4px;
      font-size: 13px;
    }
    #tooltip .tt-folder {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 3px;
    }
    #tooltip .tt-links {
      color: #34d399;
      font-size: 11px;
    }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,8,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 16px;
      z-index: 10;
      font-size: 11px;
    }
    #legend h3 {
      color: #9ca3af;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      color: #d1d5db;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Controls HUD */
    #controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .ctrl-btn {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 8px;
      color: #a78bfa;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .ctrl-btn:hover {
      background: rgba(139, 92, 246, 0.3);
      transform: translateY(-1px);
    }

    /* Search */
    #search-bar {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    #search-input {
      background: rgba(17, 17, 34, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 24px;
      color: #f0f0f0;
      padding: 8px 18px;
      font-size: 13px;
      width: 280px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus {
      border-color: rgba(139, 92, 246, 0.8);
    }
    #search-input::placeholder { color: #4b5563; }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      background: #000008;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 16px;
    }
    #loading h2 {
      font-size: 18px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .loading-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(167, 139, 250, 0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 12px; color: #4b5563; }
  </style>
</head>
<body>
<div id="canvas-container">
  <canvas id="galaxy-canvas"></canvas>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-ring"></div>
    <h2>🌌 Memuat Galaksi Pengetahuan...</h2>
    <p>Membaca peta konstelasi ide dari Vault Anda</p>
  </div>

  <!-- HUD Top -->
  <div id="hud-top">
    <div id="hud-title">
      <div>
        <h1>🌌 Galaksi Pengetahuan Carl</h1>
        <span>Spatial 3D Knowledge Constellation — Frontier O</span>
      </div>
    </div>
    <div id="stats-badge">⭐ <span id="star-count">0</span> Bintang Ide</div>
  </div>

  <!-- Search -->
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Cari bintang idea..." oninput="searchNodes(this.value)">
  </div>

  <!-- Tooltip -->
  <div id="tooltip">
    <div class="tt-title" id="tt-title">-</div>
    <div class="tt-folder" id="tt-folder">-</div>
    <div class="tt-links" id="tt-links">-</div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <h3>Cluster Folder</h3>
    <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div> 00 Inbox</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div> 01 Projects</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> 02 Areas</div>
    <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div> 03 Resources</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fb7185"></div> 04 Archive/Secure</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e879f9"></div> 05 Daily Notes</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div> Lainnya</div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="ctrl-btn" onclick="resetView()">⟳ Reset View</button>
    <button class="ctrl-btn" onclick="toggleConnections()">🔗 Koneksi</button>
    <button class="ctrl-btn" onclick="window.close()">✕ Tutup</button>
  </div>
</div>

<script>
// ============================================================
//  GALAXY 3D — Pure Canvas 2D dengan perspektif 3D sederhana
//  (Tanpa dependensi eksternal — 100% offline)
// ============================================================

const canvas = document.getElementById('galaxy-canvas');
const ctx = canvas.getContext('2d');

let nodes = [];
let edges = [];
let rotX = 0.3, rotY = 0;
let isDragging = false, lastX = 0, lastY = 0;
let zoom = 1.0;
let showConnections = true;
let searchTerm = '';
let animFrame = 0;
let autoRotate = true;

// Warna per folder
const FOLDER_COLORS = {
  '00': '#60a5fa',
  '01': '#a78bfa',
  '02': '#f59e0b',
  '03': '#34d399',
  '04': '#fb7185',
  '05': '#e879f9',
  'default': '#f97316'
};

function getFolderColor(folder) {
  const key = Object.keys(FOLDER_COLORS).find(k => folder.toLowerCase().includes(k));
  return key ? FOLDER_COLORS[key] : FOLDER_COLORS['default'];
}

// Project 3D → 2D dengan perspektif sederhana
function project(x, y, z) {
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const cy = Math.cos(rotY), sy = Math.sin(rotY);

  // Rotasi Y
  let x1 = x * cy - z * sy;
  let z1 = x * sy + z * cy;
  // Rotasi X
  let y1 = y * cx - z1 * sx;
  let z2 = y * sx + z1 * cx;

  const fov = 700 * zoom;
  const depth = fov / (fov + z2 + 300);
  return {
    sx: canvas.width / 2 + x1 * depth,
    sy: canvas.height / 2 + y1 * depth,
    depth: depth,
    z: z2
  };
}

function drawFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background gradient radial
  const grad = ctx.createRadialGradient(
    canvas.width/2, canvas.height/2, 0,
    canvas.width/2, canvas.height/2, canvas.width * 0.6
  );
  grad.addColorStop(0, '#050516');
  grad.addColorStop(1, '#000008');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Auto-rotate perlahan
  if (autoRotate && !isDragging) {
    rotY += 0.002;
  }

  // Project semua nodes
  const projected = nodes.map(n => ({
    ...n,
    proj: project(n.x, n.y, n.z)
  }));

  // Sort by Z (far → near)
  projected.sort((a, b) => a.proj.z - b.proj.z);

  // Draw edges dulu (Lookup O(1) via Map untuk performa 60 FPS)
  if (showConnections) {
    const nodeMap = new Map(projected.map(n => [n.id, n]));
    for (const edge of edges) {
      const src = nodeMap.get(edge.source);
      const tgt = nodeMap.get(edge.target);
      if (!src || !tgt) continue;

      // Skip jika salah satu tidak visible (search filter)
      const srcVis = !searchTerm || src.title.toLowerCase().includes(searchTerm);
      const tgtVis = !searchTerm || tgt.title.toLowerCase().includes(searchTerm);
      if (!srcVis && !tgtVis) continue;

      const alpha = (srcVis && tgtVis) ? 0.12 : 0.04;
      const avgDepth = (src.proj.depth + tgt.proj.depth) / 2;

      ctx.beginPath();
      ctx.moveTo(src.proj.sx, src.proj.sy);
      ctx.lineTo(tgt.proj.sx, tgt.proj.sy);
      ctx.strokeStyle = `rgba(139, 92, 246, ${alpha * avgDepth})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  // Draw nodes
  for (const n of projected) {
    const p = n.proj;
    const isMatch = searchTerm && n.title.toLowerCase().includes(searchTerm);
    const isActive = !searchTerm || isMatch;
    const alpha = isActive ? Math.min(1, p.depth * 1.2) : 0.12;
    const r = Math.max(2, n.size * p.depth * (isMatch ? 1.8 : 1));

    // Glow effect untuk nodes aktif
    if (isActive) {
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r * 3, 0, Math.PI * 2);
      const glow = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 3);
      glow.addColorStop(0, n.color + '40');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fill();
    }

    // Star dot
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
    ctx.fillStyle = isActive
      ? n.color + Math.round(alpha * 255).toString(16).padStart(2, '0')
      : '#ffffff18';
    ctx.fill();

    // Label untuk node dekat
    if (isActive && p.depth > 0.7 && r > 3) {
      ctx.font = `${Math.round(9 + r)}px -apple-system, sans-serif`;
      ctx.fillStyle = `rgba(220,220,240,${Math.min(1, alpha * 1.5)})`;
      ctx.textAlign = 'center';
      ctx.fillText(
        n.title.length > 20 ? n.title.substring(0, 20) + '…' : n.title,
        p.sx,
        p.sy + r + 12
      );
    }
  }

  animFrame = requestAnimationFrame(drawFrame);
}

// Resize handler
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

// Mouse interactions
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  autoRotate = false;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = (e.clientX - lastX) * 0.005;
    const dy = (e.clientY - lastY) * 0.005;
    rotY += dx;
    rotX += dy;
    rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
    lastX = e.clientX;
    lastY = e.clientY;
  }

  // Tooltip
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  checkHover(mx, my, e.clientX, e.clientY);
});

window.addEventListener('mouseup', () => { isDragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.max(0.3, Math.min(3, zoom));
}, { passive: false });

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    autoRotate = false;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    const dx = (e.touches[0].clientX - lastX) * 0.005;
    const dy = (e.touches[0].clientY - lastY) * 0.005;
    rotY += dx; rotX += dy;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    zoom *= dist / lastTouchDist;
    zoom = Math.max(0.3, Math.min(3, zoom));
    lastTouchDist = dist;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { isDragging = false; });

// Hover / Tooltip
const tooltip = document.getElementById('tooltip');
function checkHover(mx, my, clientX, clientY) {
  let found = null;
  let minDist = 30;

  for (const n of nodes) {
    const p = project(n.x, n.y, n.z);
    const r = Math.max(2, n.size * p.depth);
    const dist = Math.hypot(p.sx - mx, p.sy - my);
    if (dist < Math.max(r + 8, minDist)) {
      minDist = dist;
      found = { ...n, proj: p };
    }
  }

  if (found) {
    document.getElementById('tt-title').textContent = found.title;
    document.getElementById('tt-folder').textContent = `📁 ${found.folder}`;
    document.getElementById('tt-links').textContent = `🔗 ${found.links} koneksi`;
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(clientX + 16, window.innerWidth - 240) + 'px';
    tooltip.style.top = Math.max(clientY - 60, 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
}

// Controls
function resetView() {
  rotX = 0.3; rotY = 0; zoom = 1.0;
  autoRotate = true;
}
function toggleConnections() {
  showConnections = !showConnections;
}
function searchNodes(val) {
  searchTerm = val.toLowerCase().trim();
}

// Load galaxy data dari API
async function loadGalaxyData() {
  try {
    const resp = await fetch('/api/galaxy');
    if (!resp.ok) throw new Error('API error');
    const data = await resp.json();

    nodes = data.nodes || [];
    edges = data.edges || [];

    document.getElementById('star-count').textContent = nodes.length;
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    // Fallback: demo galaxy jika API gagal
    console.warn('Menggunakan data demo:', err);
    generateDemoGalaxy();
    document.getElementById('loading').style.display = 'none';
  }
}

function generateDemoGalaxy() {
  const DEMO_TOPICS = [
    'Proyek AI 2026', 'Strategi Bisnis', 'Catatan Harian', 'Research Paper',
    'Code Python', 'Ide Startup', 'Goals 2026', 'Meeting Notes',
    'Framework', 'Obsidian Tips', 'Knowledge Graph', 'Deep Learning',
    'Productivity', 'Second Brain', 'Mind Map', 'Carl AI'
  ];
  const FOLDERS = ['01-Projects', '02-Areas', '03-Resources', '05-Daily Notes'];
  const COLORS = ['#a78bfa', '#f59e0b', '#34d399', '#e879f9'];

  nodes = DEMO_TOPICS.map((t, i) => {
    const theta = (i / DEMO_TOPICS.length) * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI;
    const r = 150 + Math.random() * 120;
    const folderIdx = Math.floor(Math.random() * FOLDERS.length);
    return {
      id: i,
      title: t,
      folder: FOLDERS[folderIdx],
      color: COLORS[folderIdx],
      size: 4 + Math.random() * 6,
      links: Math.floor(Math.random() * 8),
      x: r * Math.cos(theta) * Math.cos(phi),
      y: r * Math.sin(phi) * 0.5,
      z: r * Math.sin(theta) * Math.cos(phi)
    };
  });

  // Random edges
  edges = [];
  for (let i = 0; i < 24; i++) {
    edges.push({
      source: Math.floor(Math.random() * nodes.length),
      target: Math.floor(Math.random() * nodes.length)
    });
  }

  document.getElementById('star-count').textContent = nodes.length;
}

// Init
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawFrame();
loadGalaxyData();
</script>
</body>
</html>
